[project]
name = "wavoice"
version = "0.4.1"
description = "One-command WhatsApp Voice AI with Pipecat, Retell, LiveKit, and Dograh"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Amit Bhakt", email = "yashubhakt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "fastapi>=0.143.0",
    "livekit-agents>=1.8.8",
    "livekit-api>=1.2.2",
    "loguru>=0.7.3",
    "pipecat-ai[google,webrtc]>=1.12.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
wavoice = "wavoice.cli:cli"
wa-voice = "wavoice.cli:cli"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore:'audioop' is deprecated:DeprecationWarning",
    "ignore::DeprecationWarning:pipecat.*",
]
addopts = "-ra -q --strict-markers"
